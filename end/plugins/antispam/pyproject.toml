[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-antispam"
version = "0.1.0"
description = "Chat flood control at the packet level"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."endstone"]
antispam = "endstone_antispam:Antispam"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_antispam"]
