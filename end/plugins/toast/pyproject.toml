[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-toast"
version = "0.1.0"
description = "Toast notifications (the pop-in card at the top): a welcome toast, and /notify <text> for everyone"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."endstone"]
toast = "endstone_toast:Toast"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_toast"]
