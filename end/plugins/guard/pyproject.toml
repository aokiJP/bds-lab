[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-guard"
version = "0.1.0"
description = "A no-entry zone that cancels the movement itself"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."endstone"]
guard = "endstone_guard:Guard"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_guard"]
