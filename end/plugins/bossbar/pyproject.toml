[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-bossbar"
version = "0.1.0"
description = "Boss bars from a plugin: /countdown <seconds> [title] shows each player their own draining bar, then a title"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."endstone"]
bossbar = "endstone_bossbar:Bossbar"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_bossbar"]
