[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-webapi"
version = "0.1.0"
description = "Web API: the server answers HTTP (status, players, POST /say with a token)"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."endstone"]
webapi = "endstone_webapi:Webapi"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_webapi"]
