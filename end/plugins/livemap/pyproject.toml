[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-livemap"
version = "0.1.0"
description = "A live web map: the land from above and every player moving on it, in a browser"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."endstone"]
livemap = "endstone_livemap:Livemap"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_livemap"]
