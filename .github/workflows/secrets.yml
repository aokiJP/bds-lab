name: secrets
# The repository's secrets set from a phone, with no node and no terminal: Run workflow (GitHub's app or site) → your
# Discord DM gets a button → it opens a form with a field for each name below → what you send becomes those secrets.
# A form leaves nothing in the chat; `NAME=value` lines as a message work too (delete that message after: a bot cannot).
# The values are hidden in this run's log the moment they arrive (::add-mask::) and never printed (app/lib/secretform.mjs).
# Needs, once (Settings → Secrets and variables → Actions):
#   DISCORD_BOT_TOKEN   your own bot's token (Discord Developer Portal → your application → Bot → Reset Token)
#   DISCORD_USER_ID     your Discord user id (Settings → Advanced → Developer Mode on; your profile → Copy User ID)
#   the lab's GitHub App (the panel's 「準備」 makes it: variable APP_ID, secret APP_PRIVATE_KEY — an hour's token that may
#   write this repository's secrets alone, common/ghapp.mjs), or else
#   LAB_SECRETS_TOKEN   a fine-grained token for this repository only, Repository permissions → Secrets: Read and write
#                       (Settings → Developer settings → Personal access tokens → Fine-grained tokens): GITHUB_TOKEN
#                       cannot write secrets
# Discord lets a bot DM you only while it shares a server with you: make a server of your own, invite the bot (OAuth2 →
# URL Generator → scope "bot"), and keep it there; Privacy → "Allow DMs from server members" on for that server.
on:
  workflow_dispatch:
    inputs:
      names:
        description: '登録する秘密の名前（, で区切る。5 つまで）'
        default: 'MS_EMAIL,MS_PASSWORD'
        type: string
      minutes:
        description: 'Discord の返事を待つ分（1〜30）'
        default: '10'
        type: string
permissions: { contents: read }
concurrency: { group: secrets, cancel-in-progress: false }
jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      # the lab's GitHub App, when there is one: an hour's token that may write this repository's secrets and nothing else
      - name: App のトークン（App があれば）
        if: vars.APP_ID != ''
        continue-on-error: true
        env:
          APP_ID: ${{ vars.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: node common/ghapp.mjs token "$GITHUB_REPOSITORY" --perm secrets=write --env APP_TOKEN
      - name: Discord の DM で値を聞いて、秘密に登録
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          GH_TOKEN: ${{ env.APP_TOKEN || secrets.LAB_SECRETS_TOKEN }}
          NAMES: ${{ inputs.names }}
          MINUTES: ${{ inputs.minutes }}
        run: node lab.mjs app secrets ask --names "$NAMES" --minutes "$MINUTES"
