name: maint
# Weekly: the thirteen health checks of `node lab.mjs maint --online` (secrets, leaks, scripts, token shape, shared pack UUIDs,
# a stale kb.json and version lists, newer releases of BDS / playwright-core / apkeep …). Read-only: findings go to the run
# summary; nothing is committed (maintain --pr commits refreshed common/data with the units it fixed).
on:
  schedule: [{ cron: '41 3 * * 1' }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  maint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22 }
      - run: node lab.mjs maint --online
        env: { GITHUB_TOKEN: '${{ github.token }}' }
