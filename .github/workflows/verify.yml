name: verify
# every push: the engine against fake servers (no network), then every unit of each lab on its real server with the real client
# On push and pull requests: Linux only (the offline tests and the BDS lab). By hand (workflow_dispatch) or a push whose commit
# message has [full ci]: macOS too, and
# Endstone (Linux) and LeviLamina (Windows) — a macOS minute counts as 10 and a Windows one as 2 on a private repository.
# (hashFiles is not allowed in a job's `if`: there it made the whole file invalid and no job ever ran; it is a step now)
on:
  push:
    branches: ['**']
    # the autopilot's memory alone (auto/: a ledger row after each task, failed ones too, every hour) is no code to verify: each such
    # push used to start the whole verify run
    paths-ignore: ['auto/**']
  pull_request:
    paths-ignore: ['auto/**']
  workflow_dispatch:
# least privilege: CI only reads the repository
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
# a pull request from a branch of this repository is already verified by that branch's push: only a fork's runs here
jobs:
  offline:
    # all three labs end to end against fake servers (tests/fake): flavors, deploy, helpers, reload, pack, and the macOS way
    # (server side in a container, through a fake docker CLI); the real player's packets against a recording client.
    # macos-latest runs the lab itself natively on macOS (GitHub's macOS runners have no Docker: the container path is the fake)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full ci]')) && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    # (the app lab's fake device alone is ~20 minutes on 2 cores; a private repository's runner has 2)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22 }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: '3.12' }
      - run: npm i -g esbuild@0.28 typescript@6.0.3
      # real bugs, not style: names that do not exist, values computed and never used, code that cannot run (tests/eslint.config.mjs)
      - if: matrix.os == 'ubuntu-latest'
        run: npx --yes eslint@9 -c tests/eslint.config.mjs .
      # every offline test side by side (common/run-tests.mjs; the ones that share the lab folder one by one): the gate the
      # autopilot keeps an engine change by and `share` checks a release with (common/auto-guard.mjs), and the rest — the three
      # labs end to end, the real player's packets, NetherNet, the environment, the app lab, latest, maint, upkeep, login, lan.
      # One runner's cores used at once: a fraction of the minutes the same tests took one after another
      - name: every offline test
        env:
          # (the vendored nethernet-connect present: its test must run; absent: it says SKIP, and the warning below says why)
          LAB_REQUIRE_LAN: ${{ hashFiles('common/nethernet-connect/dist/src/index.js') != '' && '1' || '0' }}
        run: node lab.mjs auto gate --all
      - name: GitHub flows (fake gh)
        run: node bds/bench/github-smoke.mjs
      - if: hashFiles('common/nethernet-connect/dist/src/index.js') == ''
        run: echo "::warning title=lan-offline not run::common/nethernet-connect/dist is not in this repository - vendor it from the nethernet-connect project (node scripts/vendor.mjs <this lab>), then lan and its test run here"

  bds:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: bds } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { lfs: true }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22 }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: bds/.lab
          key: bds-${{ runner.os }}-${{ hashFiles('bds/vendor/bds-version.txt', 'common/data/bds-versions.json') }}
      - run: node lab.mjs bds
      - run: node bench/bench.mjs selftest
      # the from-scratch lessons: the reference passes every one in the sandbox and on this BDS, the empty template fails
      - run: node ../lab.mjs scratch selftest --real
      # why, chaos, shrink, gaps, record, harden (a scripted AI) and mutate on the real server, end to end
      - run: node ../tests/dev-bds.mjs
      - name: test and pack every addon
        run: |
          set -e
          for d in addons/*/; do
            a=$(basename "$d"); [ -f "addons/$a/bp/manifest.json" ] || continue
            echo "::group::$a"; node lab.mjs test -a "$a"; node lab.mjs pack -a "$a"; echo "::endgroup::"
          done
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: bds-addons, path: 'bds/dist/*', if-no-files-found: ignore }

  end:
    # Endstone on Linux: Python venv + endstone from PyPI; Endstone downloads the BDS it supports
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: end } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # (a plugin to test at all: here, where hashFiles is allowed)
      - id: has
        if: hashFiles('end/plugins/*/pyproject.toml', 'end/plugins/*/CMakeLists.txt') != ''
        run: echo "yes=true" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.yes == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22 }
      - if: steps.has.outputs.yes == 'true'
        id: py
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: '3.12' }
      # (the venv in end/.lab links to this exact Python: another 3.12.x on the next runner made a restored venv that could not
      # run, and every plugin's server crashed. The lab now remakes such a venv itself; the key keeps it from being restored)
      - if: steps.has.outputs.yes == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: end/.lab
          key: end-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('end/flavor.mjs') }}
      - if: steps.has.outputs.yes == 'true'
        run: node lab.mjs server
      - name: test and pack every plugin
        if: steps.has.outputs.yes == 'true'
        run: |
          # every plugin, then the ones that failed (one failure does not hide the rest)
          bad=""
          for d in plugins/*/; do
            [ -d "$d" ] || continue; p=$(basename "$d")
            echo "::group::$p"
            if node lab.mjs test -a "$p" --cov && node lab.mjs pack -a "$p"; then :; else bad="$bad $p"; echo "::error title=endstone $p::test or pack failed"; fi
            echo "::endgroup::"
          done
          [ -z "$bad" ] || { echo "failed:$bad"; exit 1; }
      - if: always() && steps.has.outputs.yes == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: endstone-plugins, path: 'end/dist/*', if-no-files-found: ignore }

  ll:
    # LeviLamina natively on Windows: lip installs LeviLamina + LegacyScriptEngine; xmake builds native mods
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full ci]')
    runs-on: windows-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: ll, shell: bash } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: has
        if: hashFiles('ll/mods/*/manifest.json', 'll/mods/*/xmake.lua') != ''
        run: echo "yes=true" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.yes == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22 }
      - if: steps.has.outputs.yes == 'true'
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with: { xmake-version: latest }
      - if: steps.has.outputs.yes == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ll/.lab
          key: ll-${{ runner.os }}-${{ hashFiles('ll/flavor.mjs') }}
      - if: steps.has.outputs.yes == 'true'
        run: node lab.mjs server
      - name: test and pack every mod
        if: steps.has.outputs.yes == 'true'
        run: |
          # every mod, then the ones that failed (one failure does not hide the rest)
          bad=""
          for d in mods/*/; do
            [ -d "$d" ] || continue; m=$(basename "$d")
            echo "::group::$m"
            if node lab.mjs test -a "$m" && node lab.mjs pack -a "$m"; then :; else bad="$bad $m"; echo "::error title=levilamina $m::test or pack failed"; fi
            echo "::endgroup::"
          done
          [ -z "$bad" ] || { echo "failed:$bad"; exit 1; }
      - if: always() && steps.has.outputs.yes == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: levilamina-mods, path: 'll/dist/*', if-no-files-found: ignore }
