name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: private かどうかを確かめる
        run: |
          if [ "${{ github.event.repository.private }}" != "true" ]; then
            echo "::error::public なリポジトリでは動かしません（BDS を同梱しているため）"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install --ignore-scripts --no-audit --no-fund

      - name: 実機（BDS）が載っているか見る
        id: bds
        run: |
          if [ ! -f vendor/bedrock-server.zip ]; then
            echo "::notice::vendor/bedrock-server.zip がありません。実機での検証は飛ばします（載せるには git-lfs を入れてから push してください）"
            echo "have=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SIZE=$(stat -c%s vendor/bedrock-server.zip)
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::vendor/bedrock-server.zip が $SIZE バイトしかありません（Git LFS のポインタのままです）。checkout の lfs: true と git-lfs を確かめてください"
            exit 1
          fi
          ls -lh vendor/bedrock-server.zip
          echo "have=true" >> "$GITHUB_OUTPUT"

      - name: 実機なしでできる自己点検
        run: npm run selftest

      - name: 実機で検証
        if: steps.bds.outputs.have == 'true'
        run: npm run check -- --no-github

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: .bds-lab/report.json
          if-no-files-found: warn

      - name: 落ちたときはサーバーの出力を出す
        if: failure()
        run: tail -n 80 .bds-lab/server.log || true
