name: latest
# Every 6 hours: is there a newer Minecraft (BDS), Endstone or LeviLamina? If so, every addon / plugin / mod is tested and
# packed on it. Endstone or LeviLamina not on the newest BDS yet → "waiting", and the next run looks again until they are.
# A result (ok / waiting) is remembered per (lab, newest BDS, newest lab release, the units' files): nothing is redone until
# one of them changes. A failure is retried and reported in one issue per lab (closed when everything passes again).
# A failure is then maintained by itself (node lab.mjs maintain: module versions → an AI patch → limited mode for units with
# features.json) and the fixes come as one pull request per version (branch maintain/<version>). The AI step needs the
# ANTHROPIC_API_KEY (or OPENAI_API_KEY) secret; without it only the steps without AI run. The PR needs Settings → Actions →
# "Allow GitHub Actions to create and approve pull requests" (else the branch is pushed and the log says so).
# LAB_NOTIFY_WEBHOOK (secret, optional): a Discord / Slack / ntfy message when it starts failing, is fixed, or passes again.
on:
  schedule: [{ cron: '17 */6 * * *' }]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency: { group: latest, cancel-in-progress: false }

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bds: ${{ steps.p.outputs.bds }}
      endstone: ${{ steps.p.outputs.endstone }}
      ll: ${{ steps.p.outputs.ll }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { sparse-checkout: common }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22 }
      - id: p
        run: node common/latest.mjs probe
        env: { GITHUB_TOKEN: '${{ github.token }}' }

  lab:
    needs: probe
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lab: bds, os: ubuntu-latest, units: 'bds/addons/**', release: '' }
          - { lab: end, os: ubuntu-latest, units: 'end/plugins/**', release: endstone }
          - { lab: ll, os: windows-latest, units: 'll/mods/**', release: ll }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults: { run: { shell: bash } }
    env:
      GH_TOKEN: ${{ github.token }}
      NEWEST: ${{ needs.probe.outputs.bds }}-${{ matrix.release == 'endstone' && needs.probe.outputs.endstone || matrix.release == 'll' && needs.probe.outputs.ll || 'bds' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { lfs: true }
      - name: already checked?
        id: seen
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .latest-${{ matrix.lab }}
          key: latest-${{ matrix.lab }}-${{ env.NEWEST }}-${{ hashFiles(matrix.units, format('{0}/flavor.mjs', matrix.lab), 'common/core.mjs', 'common/realplayer.cjs') }}
      - if: steps.seen.outputs.cache-hit == 'true'
        run: |
          echo "already checked with these versions and files: $(cat .latest-${{ matrix.lab }})" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.seen.outputs.cache-hit != 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22 }
      - if: steps.seen.outputs.cache-hit != 'true' && matrix.lab == 'end'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: '3.12' }
      - if: steps.seen.outputs.cache-hit != 'true' && matrix.lab == 'll'
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with: { xmake-version: latest }
      - if: steps.seen.outputs.cache-hit != 'true'
        id: run
        run: |
          printf '%s' '{"bds":"${{ needs.probe.outputs.bds }}","endstone":"${{ needs.probe.outputs.endstone }}","ll":"${{ needs.probe.outputs.ll }}"}' > .probe.json
          LAB_LATEST_FIXTURE=.probe.json node common/latest.mjs run ${{ matrix.lab }}
        env: { LAB_NOTIFY_WEBHOOK: '${{ secrets.LAB_NOTIFY_WEBHOOK }}' }
      # broken on the newest: fix what can be fixed (the lab is already on it) and send it as a pull request
      - if: failure() && steps.run.outputs.result == 'fail'
        run: node lab.mjs maintain --lab ${{ matrix.lab }} --to current --pr
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LAB_MODEL: ${{ vars.LAB_MODEL }}
          LAB_TOKEN_BUDGET: ${{ vars.LAB_TOKEN_BUDGET || '2000000' }}
          LAB_NOTIFY_WEBHOOK: ${{ secrets.LAB_NOTIFY_WEBHOOK }}
      - if: always() && steps.run.outputs.result == 'fail'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: 'maintain-${{ matrix.lab }}', path: '${{ matrix.lab }}/.lab/maintain/', if-no-files-found: ignore }
      # ok / waiting: remembered until a version or a unit changes (a failure is not: the next run tries again)
      - if: steps.seen.outputs.cache-hit != 'true' && (steps.run.outputs.result == 'ok' || steps.run.outputs.result == 'wait')
        run: echo "${{ steps.run.outputs.result }} ($NEWEST)" > .latest-${{ matrix.lab }}
      - if: steps.seen.outputs.cache-hit != 'true' && (steps.run.outputs.result == 'ok' || steps.run.outputs.result == 'wait')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .latest-${{ matrix.lab }}
          key: ${{ steps.seen.outputs.cache-primary-key }}
      - if: always() && steps.run.outputs.result == 'ok'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: 'latest-${{ matrix.lab }}', path: '${{ matrix.lab }}/dist/*', if-no-files-found: ignore }
