name: copilot-setup-steps
# GitHub Copilot coding agent: runs before the agent starts, while the network is open, so the agent finds every server and tool
# already in place. Same idea for any agent with a setup phase: `./lab.sh setup all` there (the lab needs no network afterwards,
# except NetherNet players' first install and new BDS versions).
on: workflow_dispatch
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22 }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: '3.12' }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends wine winetricks cabextract || true   # ll: a Wine older than 10 is replaced by a portable one in the cache
      - run: node lab.mjs doctor || true
      - run: node lab.mjs setup all || true
