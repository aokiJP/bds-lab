name: auto
# The autopilot (common/auto.mjs): every hour the AI decides what bds-lab does next — repair a broken unit, follow the newest
# Minecraft, build an issue labeled `auto`, release, work through its own backlog, change the lab itself, playtest, harden,
# replan, invent new addons — does it on real servers with real clients, and merges what passes (and a second AI approves)
# into this branch, with a Release for a unit. Its memory is auto/ (ledger, backlog, lessons), committed with each change.
# Setup: the secret ANTHROPIC_API_KEY (or OPENAI_API_KEY + the variables OPENAI_BASE_URL / OPENAI_MODEL); optional variables
# LAB_MODEL, LAB_AUTO_TICKS (tasks per run, default 1). Stop it: commit auto/STOP (`node lab.mjs auto stop`), or set the
# variable LAB_AUTO=off. The caps are auto/policy.json (dailyTokens, taskTokens), which only a person edits.
on:
  schedule: [{ cron: '17 * * * *' }]
  workflow_dispatch:
    inputs:
      ticks: { description: 'tasks to do in this run', required: false, default: '1' }
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: auto
  cancel-in-progress: false
jobs:
  auto:
    if: vars.LAB_AUTO != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0, lfs: true }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22 }
      # the servers and tools of earlier runs, and each unit's last failure (what `repair` is made from)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            bds/.lab
            end/.lab
            ll/.lab
          key: auto-${{ runner.os }}-${{ hashFiles('bds/vendor/bds-version.txt', 'common/data/bds-versions.json', 'end/flavor.mjs', 'll/flavor.mjs') }}
          restore-keys: auto-${{ runner.os }}-
      # work this hour? Decided before the costly set-up: an idle run (no task, stopped, out of tokens) ends here, about a minute
      # (the hourly schedule with every set-up each time used up the account's Actions minutes)
      - id: plan
        name: work this hour?
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: node lab.mjs auto plan | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.plan.outputs.work == 'yes' && contains(steps.plan.outputs.labs, 'end')
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - if: steps.plan.outputs.work == 'yes'
        run: npm i -g esbuild@0.28 typescript@6.0.3
      - if: steps.plan.outputs.work == 'yes' && contains(steps.plan.outputs.labs, 'll')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends wine winetricks cabextract || true   # ll only
      - name: autopilot
        if: steps.plan.outputs.work == 'yes'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          LAB_MODEL: ${{ vars.LAB_MODEL }}
          LAB_NOTIFY_WEBHOOK: ${{ secrets.LAB_NOTIFY_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'bds-lab autopilot'
          node lab.mjs auto run --ticks "${{ inputs.ticks || vars.LAB_AUTO_TICKS || 1 }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always() && steps.plan.outputs.work == 'yes'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: auto, path: '*/dist/*', if-no-files-found: ignore }
