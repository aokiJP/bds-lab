name: bundle

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'AGENTS.md']

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: private かどうかを確かめる
        run: |
          if [ "${{ github.event.repository.private }}" != "true" ]; then
            echo "::error::public なリポジトリでは動かしません（BDS を同梱するため）"
            exit 1
          fi

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install --ignore-scripts --no-audit --no-fund

      - name: 配布用の zip を作って Release を更新する
        run: npm run bds:release
        env:
          GH_TOKEN: ${{ github.token }}
