name: schedule
# The lab's own timetable (.github/bds-lab-schedule.json, kept from the management panel's 「予約」): once an hour, the jobs whose
# time it is are started here (common/schedule.mjs, the same checks as the panel's) — each one a workflow_dispatch of this
# repository's own workflows on its default branch, under this run's short-lived token. Nothing runs when the file is absent.
# Started by hand it only says what is due now (--dry): the hour's own run starts them, once.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: schedule
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22 }
      - name: start what is due
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && '--dry' || '' }}
        run: node lab.mjs schedule ci $DRY
